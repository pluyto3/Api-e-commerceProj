<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Forgot Password - Hanz-Go</title>

    <!-- Shared Hanz-Go authentication styling -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/auth.css" />
    <link rel="stylesheet" href="assets/css/all.css" />
    <link rel="stylesheet" href="assets/css/sweetalert2.css" />
    <link rel="stylesheet" href="assets/css/responsive-fixes.css" />

    <!-- Required JavaScript -->
    <script src="assets/js/jquery-3.5.1.min.js"></script>
    <script src="assets/js/sweetalert2.all.js"></script>

    <!-- Configuration must load before forgotpwd.js -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/forgotpwd.js"></script>
  </head>

  <body class="auth-page forgot-page">
    <main class="auth-container">
      <!-- Same logo as the Hanz-Go Login page -->
      <div class="logo-box">
        <img src="assets/img/HanzGo.png" alt="Hanz-Go Logo" />
      </div>

      <!-- Heading -->
      <h1 class="auth-title">Forgot Password?</h1>

      <p class="auth-subtitle">
        Enter your registered email address and we'll send you a link to reset
        your password.
      </p>

      <!-- Forgot Password Form -->
      <form id="forgotPasswordForm">
        <div class="form-group">
          <label for="email"> Email Address </label>

          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            placeholder="Enter your email address"
            autocomplete="email"
            required />

          <small id="emailError" class="text-danger error-message" role="alert">
          </small>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="forgot_password" class="auth-btn">
          Send Reset Link
        </button>
      </form>

      <!-- Navigation -->
      <div class="bottom-link">
        <a href="login.html"> &larr; Back to Login </a>
      </div>

      <div class="bottom-link">
        Don't have an account?
        <a href="register.html">Register</a>
      </div>
    </main>
  </body>
</html>
