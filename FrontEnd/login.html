<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Hanz-Go</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/auth.css" />
    <link rel="stylesheet" href="assets/css/all.css" />
    <link rel="stylesheet" href="assets/css/sweetalert2.css" />
    <link rel="stylesheet" href="assets/css/borderless.css" />
    <link rel="stylesheet" href="assets/css/owl.carousel.min.css" />
    <link rel="stylesheet" href="assets/css/owl.theme.default.min.css" />
    <link rel="stylesheet" href="assets/css/jquery.bxslider.min.css" />
    <link rel="stylesheet" href="assets/css/responsive-fixes.css" />
    <link rel="stylesheet" href="assets/css/skeleton.css" />
    <script src="assets/js/jquery-3.5.1.min.js"></script>
    <script src="assets/js/popper.min.js"></script>
    <script src="assets/js/fontawesome.min.js"></script>
    <script src="assets/js/bootstrap.min.js"></script>
    <script src="assets/js/sweetalert2.all.js"></script>
    <script src="assets/js/jquery.cookie.js"></script>
    <script src="assets/js/owl.carousel.min.js"></script>
    <script src="assets/js/jquery.bxslider.min.js"></script>

    <!-- Firebase Notification -->
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging-compat.js"></script>
    <script src="assets/js/password-toggle.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/firebase-notification.js"></script>
    <script src="assets/js/skeleton-loader.js"></script>

    <!-- Custom JS -->
    <script src="assets/js/login.js"></script>
  </head>

  <body class="auth-page login-page">
    <div class="auth-container">
      <div class="logo-box">
        <img src="assets/img/HanzGo.png" alt="Hanz-Go Logo" />
      </div>

      <h1 class="auth-title">Login</h1>
      <p class="auth-subtitle">Find it, buy it, done.</p>

      <div class="auth-tabs">
        <a href="login.html" class="active">Login</a>
        <a href="register.html">Register</a>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label>Username</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-control"
            placeholder="Enter your username"
            autocomplete="username"
            required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <div class="password-field">
            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="Enter password"
              autocomplete="current-password"
              required />

            <button
              type="button"
              class="password-toggle"
              data-target="password"
              aria-label="Show password"
              aria-pressed="false"
              title="Show password">
              <i class="far fa-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <div class="auth-options">
          <label> <input type="checkbox" /> Remember me </label>
          <a href="forgot.html">Forgot password?</a>
        </div>

        <button type="submit" class="auth-btn">Login</button>
      </form>

      <div class="bottom-link">
        Don’t have an account? <a href="register.html">Register</a>
      </div>
    </div>
  </body>
</html>
