<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="referrer" content="no-referrer" />

    <title>Reset Password - Hanz-Go</title>

    <!-- Shared Hanz-Go styling -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/auth.css" />
    <link rel="stylesheet" href="assets/css/all.css" />
    <link rel="stylesheet" href="assets/css/sweetalert2.css" />
    <link rel="stylesheet" href="assets/css/responsive-fixes.css" />
    <link rel="stylesheet" href="assets/css/skeleton.css" />

    <!-- Required JavaScript -->
    <script src="assets/js/jquery-3.5.1.min.js"></script>
    <script src="assets/js/jquery.cookie.js"></script>
    <script src="assets/js/sweetalert2.all.js"></script>

    <!-- Hanz-Go shared functionality -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/password-toggle.js"></script>
    <script src="assets/js/skeleton-loader.js"></script>

    <!-- Existing password reset functionality -->
    <script src="assets/js/resetPasswrd.js"></script>

    <!-- Preserve existing authenticated-user redirect -->
    <script>
      if (
        $.cookie("username") !== undefined &&
        $.cookie("token") !== undefined
      ) {
        window.location.replace("index.html");
      }
    </script>
  </head>

  <body class="auth-page reset-page">
    <main class="auth-container">
      <!-- Hanz-Go Logo -->
      <div class="logo-box">
        <img src="assets/img/HanzGo.png" alt="Hanz-Go Logo" />
      </div>

      <!-- Heading -->
      <h1 class="auth-title">Reset Password</h1>

      <p class="auth-subtitle">
        Create a new password to secure your Hanz-Go account.
      </p>

      <!-- Reset Password Form -->
      <form id="resetPasswordForm">
        <!-- New Password -->
        <div class="form-group">
          <label for="password">New Password</label>

          <div class="password-field">
            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="Enter new password"
              autocomplete="new-password"
              minlength="8"
              required />

            <button
              type="button"
              class="password-toggle"
              data-target="password"
              aria-label="Show password"
              aria-pressed="false"
              title="Show password">
              <i class="far fa-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirm_password"> Confirm Password </label>

          <div class="password-field">
            <input
              type="password"
              id="confirm_password"
              name="password_confirmation"
              class="form-control"
              placeholder="Confirm new password"
              autocomplete="new-password"
              minlength="8"
              required />

            <button
              type="button"
              class="password-toggle"
              data-target="confirm_password"
              aria-label="Show password"
              aria-pressed="false"
              title="Show password">
              <i class="far fa-eye" aria-hidden="true"></i>
            </button>
          </div>

          <small
            id="passwordError"
            class="text-danger error-message"
            role="alert">
          </small>
        </div>

        <!-- Submit -->
        <button type="submit" class="auth-btn">Reset Password</button>
      </form>

      <!-- Navigation -->
      <div class="bottom-link">
        <a href="login.html">&larr; Back to Login</a>
      </div>
    </main>
  </body>
</html>
