<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/auth.css" />
    <link rel="stylesheet" href="assets/css/all.css" />
    <link rel="stylesheet" href="assets/css/sweetalert2.css" />
    <link rel="stylesheet" href="assets/css/borderless.css" />
    <link rel="stylesheet" href="assets/css/owl.carousel.min.css" />
    <link rel="stylesheet" href="assets/css/owl.theme.default.min.css" />
    <link rel="stylesheet" href="assets/css/jquery.bxslider.min.css" />
    <link rel="stylesheet" href="assets/css/responsive-fixes.css" />
    <link rel="stylesheet" href="assets/css/skeleton.css" />
    <script src="assets/js/jquery-3.5.1.min.js"></script>
    <script src="assets/js/popper.min.js"></script>
    <script src="assets/js/fontawesome.min.js"></script>
    <script src="assets/js/bootstrap.min.js"></script>
    <script src="assets/js/sweetalert2.all.js"></script>
    <script src="assets/js/jquery.cookie.js"></script>
    <script src="assets/js/owl.carousel.min.js"></script>
    <script src="assets/js/jquery.bxslider.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/skeleton-loader.js"></script>
    <script src="assets/js/registration.js"></script>
    <script src="assets/js/password-toggle.js"></script>
  </head>
  <body class="auth-page register-page">
    <div class="auth-container">
      <div class="logo-box">
        <img src="assets/img/hanz-goLogo.png" alt="Hanz-Go Logo" />
      </div>

      <h1 class="auth-title">Register</h1>
      <p class="auth-subtitle">Create your Hanz-Go account</p>

      <div class="auth-tabs">
        <a href="login.html">Login</a>
        <a href="register.html" class="active">Register</a>
      </div>

      <form id="signupForm">
        <div class="row-2">
          <div class="form-group">
            <label>Username</label>
            <input
              type="text"
              id="username"
              name="username"
              class="form-control"
              placeholder="Enter username"
              required />

            <small class="text-danger error-message" id="usernameError"></small>
          </div>

          <div class="form-group">
            <label>Email</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-control"
              placeholder="Enter email"
              required />

            <small class="text-danger error-message" id="emailError"></small>
          </div>
        </div>

        <div class="row-2">
          <div class="form-group">
            <label>Phone Number</label>
            <input
              type="text"
              id="phone_number"
              name="phone_number"
              class="form-control"
              placeholder="Enter phone number"
              required />

            <small
              class="text-danger error-message"
              id="phone_numberError"></small>
          </div>

          <div class="form-group">
            <label>Full Name</label>
            <input
              type="text"
              id="fullname"
              name="fullname"
              class="form-control"
              placeholder="Enter full name"
              required />

            <small class="text-danger error-message" id="fullnameError"></small>
          </div>
        </div>

        <div class="row-2">
          <!-- Password -->
          <div class="form-group">
            <label for="password">Password</label>

            <div class="password-field">
              <input
                type="password"
                id="password"
                name="password"
                class="form-control"
                placeholder="Enter password"
                autocomplete="new-password"
                required />

              <button
                type="button"
                class="password-toggle"
                data-target="password"
                aria-label="Show password"
                aria-pressed="false"
                title="Show password">
                <i class="far fa-eye" aria-hidden="true"></i>
              </button>
            </div>

            <small class="text-danger error-message" id="passwordError"></small>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label for="password_confirmation">Confirm Password</label>

            <div class="password-field">
              <input
                type="password"
                id="password_confirmation"
                name="password_confirmation"
                class="form-control"
                placeholder="Confirm password"
                autocomplete="new-password"
                required />

              <button
                type="button"
                class="password-toggle"
                data-target="password_confirmation"
                aria-label="Show password"
                aria-pressed="false"
                title="Show password">
                <i class="far fa-eye" aria-hidden="true"></i>
              </button>
            </div>

            <small
              class="text-danger error-message"
              id="password_confirmationError"></small>
          </div>
        </div>

        <div class="form-group">
          <label>Role</label>
          <select name="role" id="role" required>
            <option value="">Select role</option>
            <option value="user">User</option>
            <option value="seller">Seller</option>
          </select>

          <small class="text-danger error-message" id="roleError"></small>
        </div>

        <div class="auth-options">
          <label>
            <input type="checkbox" required /> I agree to the terms and
            conditions
          </label>
        </div>

        <button type="submit" class="auth-btn">Sign Up</button>
      </form>

      <div class="bottom-link">
        Already have an account? <a href="login.html">Back to Login</a>
      </div>
    </div>
  </body>
</html>
